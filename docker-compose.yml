services:
  # ============================================
  # React Frontend (Next.js)
  # ============================================
  frontend:
    build:
      # Context widened to repo root so the Dockerfile can COPY the top-level
      # docs/ folder into the image (needed for the /wiki route's generateStaticParams).
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - BFF_INTERNAL_URL=http://nextjs-bff:4000
    container_name: react-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BFF_URL=/api
      - BFF_INTERNAL_URL=http://nextjs-bff:4000
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # NextJS BFF
  # ============================================
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: nextjs-bff
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - PORT=4000
      - JAVA_API_URL=http://spring-backend:8080
      # ── Demo accounts ──
      - DEMO_EMPLOYEE_EMAIL=${DEMO_EMPLOYEE_EMAIL}
      - DEMO_EMPLOYEE_PASSWORD=${DEMO_EMPLOYEE_PASSWORD}
      - DEMO_MANAGER_EMAIL=${DEMO_MANAGER_EMAIL}
      - DEMO_MANAGER_PASSWORD=${DEMO_MANAGER_PASSWORD}
      - DEMO_FINANCE_EMAIL=${DEMO_FINANCE_EMAIL}
      - DEMO_FINANCE_PASSWORD=${DEMO_FINANCE_PASSWORD}
      - DEMO_ADMIN_EMAIL=${DEMO_ADMIN_EMAIL}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD}
      - DEMO_NEW_EMPLOYEE_EMAIL=${DEMO_NEW_EMPLOYEE_EMAIL}
      - DEMO_NEW_EMPLOYEE_PASSWORD=${DEMO_NEW_EMPLOYEE_PASSWORD}
      # ── Groq AI (policy insight) ──
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}

  # ============================================
  # Spring Boot Backend
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spring-backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # ── Backblaze B2 (S3-compatible) ──
      - STORAGE_ENDPOINT=${B2_ENDPOINT}
      - STORAGE_PUBLIC_ENDPOINT=${B2_ENDPOINT}
      - STORAGE_ACCESS_KEY=${B2_APPLICATION_KEY_ID}
      - STORAGE_SECRET_KEY=${B2_APPLICATION_KEY}
      - STORAGE_BUCKET=${B2_BUCKET_NAME:-receipts}
      - STORAGE_REGION=${B2_REGION:-us-west-004}
      # ── Groq API ──
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================
  # MySQL
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=12345678
      - MYSQL_DATABASE=mydb
    ports:
      - "3307:3306"
    volumes:
      - ./db_fix.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # ============================================
  # Gateway (Nginx Reverse Proxy)
  # ============================================
  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - bff

networks:
  default:
    name: portfolio-network
