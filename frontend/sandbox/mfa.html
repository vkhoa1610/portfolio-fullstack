<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Finance SaaS - MFA Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Hide arrows in number input */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-center bg-slate-50 relative overflow-hidden">

    <!-- Decoration Background -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <div class="absolute -top-[30%] -left-[10%] w-[70%] h-[70%] rounded-full bg-indigo-100/50 blur-3xl"></div>
        <div class="absolute top-[20%] -right-[10%] w-[60%] h-[60%] rounded-full bg-blue-100/50 blur-3xl"></div>
    </div>

    <!-- MFA Card -->
    <div class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        
        <!-- Header -->
        <div class="px-8 pt-8 pb-6 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 mb-6">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Sichern Sie Ihr Konto</h1>
            <p class="text-slate-500 text-sm">Scannen Sie den QR-Code mit Ihrer Authenticator-App (z.B. Google Authenticator).</p>
        </div>

        <!-- Main Content -->
        <div class="px-8 pb-8 flex flex-col items-center space-y-8">
            
            <!-- QR Code Placeholder -->
            <div class="relative group">
                <div class="w-48 h-48 bg-white border-2 border-slate-200 rounded-xl flex items-center justify-center p-4 shadow-sm group-hover:border-indigo-200 transition-colors">
                    <!-- Simulating a QR Code with an image -->
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=ExampleAuthSecret" 
                         alt="MFA QR Code" 
                         class="w-full h-full opacity-90">
                </div>
                <!-- Scan Corners Decoration -->
                <div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-indigo-600 rounded-tl-lg -mt-1 -ml-1"></div>
                <div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-indigo-600 rounded-tr-lg -mt-1 -mr-1"></div>
                <div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-indigo-600 rounded-bl-lg -mb-1 -ml-1"></div>
                <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-indigo-600 rounded-br-lg -mb-1 -mr-1"></div>
            </div>

            <!-- Verification Code Input -->
            <div class="w-full">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider text-center mb-3">
                    Bestätigungscode eingeben
                </label>
                <div class="flex justify-between gap-2">
                    <!-- 6 Digit Inputs -->
                    <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold border border-slate-300 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all bg-slate-50 focus:bg-white" value="">
                    <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold border border-slate-300 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all bg-slate-50 focus:bg-white" value="">
                    <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold border border-slate-300 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all bg-slate-50 focus:bg-white" value="">
                    <!-- Divider Dash -->
                    <div class="flex items-center justify-center text-slate-300">-</div>
                    <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold border border-slate-300 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all bg-slate-50 focus:bg-white" value="">
                    <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold border border-slate-300 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all bg-slate-50 focus:bg-white" value="">
                    <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold border border-slate-300 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all bg-slate-50 focus:bg-white" value="">
                </div>
            </div>

            <!-- Action Button -->
            <div class="w-full space-y-4">
                <button class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-lg transition-colors shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
                    Verifizieren
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
                
                <div class="text-center">
                    <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 hover:underline transition-all">
                        I cannot scan the code
                    </a>
                </div>
            </div>

        </div>
        
        <!-- Progress Bar (Optional Visual for Setup) -->
        <div class="h-1 w-full bg-slate-100">
            <div class="h-full w-1/2 bg-indigo-600 rounded-r-full"></div>
        </div>
    </div>

    <!-- Footer Links -->
    <div class="absolute bottom-6 flex gap-6 text-sm text-slate-400 font-medium">
        <a href="#" class="hover:text-slate-600 transition-colors">Impressum</a>
        <a href="#" class="hover:text-slate-600 transition-colors">Datenschutz</a>
    </div>

    <!-- Initialize Icons -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) {
                lucide.createIcons();
            } else {
                setTimeout(function() {
                    if (window.lucide) lucide.createIcons();
                }, 500);
            }
        });

        // Simple script to auto-focus next input
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
