<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Finance SaaS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Updated Lucide CDN to a more reliable source and recent version -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-screen w-full flex overflow-hidden bg-white">

    <!-- LEFT SIDE: Branding Image (50% Width) -->
    <div class="hidden lg:flex lg:w-1/2 relative bg-slate-900 items-center justify-center">
        <!-- Placeholder for Abstract Tech Image -->
        <img src="https://images.unsplash.com/photo-1639322537228-f710d846310a?q=80&w=2832&auto=format&fit=crop" 
             alt="Abstract Finance Technology" 
             class="absolute inset-0 w-full h-full object-cover opacity-60 mix-blend-overlay">
        
        <div class="relative z-10 px-12 text-center">
            <h2 class="text-4xl font-bold text-white mb-4 tracking-tight">Future of Finance</h2>
            <p class="text-slate-300 text-lg max-w-md mx-auto">Empowering enterprise efficiency with secure, AI-driven expense management.</p>
        </div>
        
        <!-- Decoration overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 to-transparent"></div>
    </div>

    <!-- RIGHT SIDE: Login Form (50% Width) -->
    <div class="w-full lg:w-1/2 flex flex-col h-full relative">
        
        <!-- Main Form Container - Centered Vertically -->
        <div class="flex-1 flex flex-col justify-center px-8 sm:px-12 md:px-24 xl:px-32">
            
            <!-- Logo Placeholder -->
            <div class="mb-10 flex items-center gap-2 text-indigo-600">
                <i data-lucide="hexagon" class="w-8 h-8 fill-current"></i>
                <span class="text-xl font-bold text-slate-900 tracking-tight">FinTech Corp.</span>
            </div>

            <div class="mb-8">
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Welcome back</h1>
                <p class="text-slate-500">Please enter your details to access the portal.</p>
            </div>

            <form class="space-y-5">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Work Email</label>
                    <input type="email" id="email" placeholder="name@company.com" 
                           class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-colors text-slate-900 placeholder-slate-400">
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                        <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" placeholder="••••••••" 
                               class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-colors text-slate-900 placeholder-slate-400 pr-10">
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Primary Button -->
                <button type="button" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
                    Sign In
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>

                <!-- Divider -->
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-400 text-sm">Or continue with</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <!-- SSO Button -->
                <button type="button" class="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-3 rounded-lg transition-colors flex items-center justify-center gap-3">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google Logo">
                    Sign in with SSO
                </button>
            </form>
        </div>

        <!-- Compliance Footer (Sticky Bottom) -->
        <div class="py-6 px-8 sm:px-12 md:px-24 xl:px-32 border-t border-slate-100 bg-white">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-slate-500">
                <span>Protected by Enterprise Security</span>
                <div class="flex gap-6 font-medium">
                    <!-- German Compliance Links -->
                    <a href="#" class="hover:text-slate-900 underline decoration-slate-300 underline-offset-2">Impressum</a>
                    <a href="#" class="hover:text-slate-900 underline decoration-slate-300 underline-offset-2">Datenschutz</a>
                </div>
            </div>
        </div>

    </div>

    <!-- Initialize Icons with Safety Check -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) {
                lucide.createIcons();
            } else {
                console.warn('Lucide icons script not loaded yet. Retrying...');
                // Fallback: Retry after short delay if script is slow
                setTimeout(function() {
                    if (window.lucide) lucide.createIcons();
                }, 500);
            }
        });
    </script>
</body>
</html>
