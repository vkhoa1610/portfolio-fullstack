<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Finance SaaS - Profile Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-center bg-slate-50 relative overflow-hidden">

    <!-- Decoration Background -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <div class="absolute top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-indigo-50/50 blur-3xl"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] rounded-full bg-violet-50/50 blur-3xl"></div>
    </div>

    <!-- Profile Setup Card 
         UPDATED: Changed max-w-md to max-w-[600px] and w-full.
         This ensures consistent width across the flow (MFA -> GDPR -> Profile).
         On a 1440px screen, X position will now consistently be (1440-600)/2 = 420px.
    -->
    <div class="relative z-10 w-full max-w-[600px] bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        
        <!-- Header -->
        <div class="px-8 pt-8 pb-2 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-50 text-indigo-600 mb-4 ring-4 ring-indigo-50/50">
                <i data-lucide="user-cog" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Profil & Einstellungen</h1>
            <p class="text-slate-500 text-sm">Personalisieren Sie Ihre Erfahrung.</p>
        </div>

        <!-- Main Content -->
        <div class="px-8 pb-8 pt-6 space-y-6">
            
            <!-- Language Selection (Interactive) -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Sprache wählen</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i data-lucide="globe" class="w-4 h-4"></i>
                    </div>
                    <select class="w-full appearance-none bg-white border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 block pl-10 p-3 pr-10 shadow-sm transition-all cursor-pointer hover:border-indigo-400">
                        <option value="de" selected>Deutsch (Deutschland)</option>
                        <option value="en">English (International)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </div>
                </div>
            </div>

            <!-- Read-only Info Card (Distinct Visual Hierarchy) -->
            <div class="bg-slate-50 rounded-xl border border-slate-200/80 p-5 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="shield-check" class="w-4 h-4 text-indigo-600"></i>
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Benutzerprofil</span>
                    </div>
                    <span class="text-[10px] font-medium px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 border border-emerald-200">
                        Aktiv
                    </span>
                </div>
                
                <div class="grid grid-cols-2 gap-6">
                    <!-- Field 1: Role -->
                    <div>
                        <p class="text-xs text-slate-500 mb-1 font-medium">Zugewiesene Rolle</p>
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-slate-900">Mitarbeiter</span>
                            <span class="inline-flex items-center justify-center w-5 h-5 rounded text-[10px] font-bold bg-slate-200 text-slate-600" title="Level 1">L1</span>
                        </div>
                    </div>
                    
                    <!-- Field 2: Budget -->
                    <div>
                        <p class="text-xs text-slate-500 mb-1 font-medium">Budgetlimit / Monat</p>
                        <p class="text-sm font-bold text-slate-900 font-mono tracking-tight text-right">5.000,00 €</p>
                    </div>
                </div>
                
                <div class="flex gap-2 items-start mt-2">
                    <i data-lucide="info" class="w-3 h-3 text-slate-400 mt-0.5 flex-shrink-0"></i>
                    <p class="text-[11px] text-slate-400 italic leading-tight">
                        Diese Einstellungen werden zentral von Ihrer IT-Abteilung basierend auf Ihrer Position verwaltet.
                    </p>
                </div>
            </div>

            <!-- Primary Action Button -->
            <button class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-lg transition-all shadow-lg hover:shadow-xl hover:-translate-y-0.5 flex items-center justify-center gap-2 group">
                Speichern & Dashboard öffnen
                <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
            </button>
        </div>
        
    </div>

    <!-- Footer Links -->
    <div class="absolute bottom-6 flex gap-6 text-sm text-slate-400 font-medium">
        <a href="#" class="hover:text-slate-600 transition-colors">Hilfe</a>
        <a href="#" class="hover:text-slate-600 transition-colors">Support kontaktieren</a>
    </div>

    <!-- Initialize Icons -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) {
                lucide.createIcons();
            } else {
                setTimeout(function() {
                    if (window.lucide) lucide.createIcons();
                }, 500);
            }
        });
    </script>
</body>
</html>
